<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>澳佳寶封面與商品卡製作檔</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#fbf8f0}body{color:#315749;font-family:"Songti TC","PMingLiU",serif}main{position:relative;width:1600px;height:1000px;overflow:hidden;background:#fbf8f0}header{position:absolute;inset:0 0 auto;height:424px;padding:45px 80px}.journal{margin:0 0 27px;font-size:31px;line-height:1.2;letter-spacing:.25em;color:#9a593a}.brand{margin:0;font-size:112px;line-height:1.25;font-weight:500}.headline{margin:25px 0 0;font-size:65px;line-height:1.35;font-weight:500;white-space:nowrap}.rule{position:absolute;left:84px;right:84px;top:389px;border-top:2px solid #d8d3c5}.products{position:absolute;top:424px;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;background:#fff;padding:18px 50px 62px;align-items:start}.product{margin:0;min-width:0;text-align:center}.product figcaption{height:70px;font-size:38px;line-height:1.4;font-weight:500}.product img{display:block;width:auto;height:426px;max-width:100%;margin:0 auto;object-fit:contain}.detail{position:absolute;left:82px;bottom:22px;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;font-size:27px;line-height:1.2;letter-spacing:.05em;color:#62695d}.card{display:none;width:1000px;height:750px}.card header{height:340px;padding:30px 52px}.card .journal{font-size:25px;margin-bottom:23px}.card .brand{font-size:78px}.card .headline{font-size:43px;margin-top:22px}.card .subline{margin:17px 0 0;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;font-size:30px;line-height:1.4;color:#62695d}.card .products{top:340px;padding:30px 32px 40px;gap:12px;align-items:center}.card .product img{height:340px}.card .product figcaption{display:none}body[data-mode="card"] .cover{display:none}body[data-mode="card"] .card{display:block}
</style>
<style>.detail{margin:0}</style>
</head>
<body>
<main class="cover" aria-label="1600乘1000澳佳寶文章封面">
  <header><p class="journal">鷹家選物誌</p><h1 class="brand">澳佳寶</h1><p class="headline">魚油、葉黃素與乳酸菌怎麼選？</p></header>
  <div class="rule"></div>
  <div class="products">
    <figure class="product"><figcaption>魚油</figcaption><img src="/assets/blackmores/kids-fish-oil.webp" width="475" height="684" alt="機伶小子魚油30顆完整瓶身"></figure>
    <figure class="product"><figcaption>葉黃素</figcaption><img src="/assets/blackmores/kids-lutein.webp" width="485" height="718" alt="兒童晶亮金盞花葉黃素60錠完整瓶身"></figure>
    <figure class="product"><figcaption>乳酸菌</figcaption><img src="/assets/blackmores/lc-plasma.webp" width="423" height="540" alt="4效特攻1000億乳酸菌15包完整盒裝"></figure>
  </div>
  <p class="detail">年齡・吃法・每顆含量</p>
</main>
<main class="card" aria-label="1000乘750澳佳寶商品卡">
  <header><p class="journal">鷹家買物社</p><h1 class="brand">澳佳寶</h1><p class="headline">魚油・葉黃素・乳酸菌</p><p class="subline">看年齡與吃法，挑適合的產品</p></header>
  <div class="products">
    <figure class="product"><img src="/assets/blackmores/kids-fish-oil.webp" width="475" height="684" alt="機伶小子魚油完整瓶身"></figure>
    <figure class="product"><img src="/assets/blackmores/kids-lutein.webp" width="485" height="718" alt="兒童金盞花葉黃素完整瓶身"></figure>
    <figure class="product"><img src="/assets/blackmores/lc-plasma.webp" width="423" height="540" alt="4效特攻乳酸菌完整盒裝"></figure>
  </div>
</main>
<script>if(new URLSearchParams(location.search).get('mode')==='card')document.body.dataset.mode='card';</script>
</body>
</html>
