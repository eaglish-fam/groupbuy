<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<title>Giaretti 珈樂堤封面原稿</title>
<style>*{box-sizing:border-box}body{margin:0}p,h1{margin:0}
.stage{position:relative;width:1600px;height:1000px;overflow:hidden;background:#f3efe8;font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC",sans-serif;color:#2b3a4a}
.panel{position:absolute;left:0;top:0;bottom:0;width:760px;background:#2b3a4a}
.side{position:absolute;right:0;top:0;height:100%;width:840px;object-fit:cover;object-position:46% 60%}
.text{position:absolute;left:80px;top:0;bottom:0;width:640px;display:flex;flex-direction:column;justify-content:center;color:#ffffff}
.brand{display:inline-block;align-self:flex-start;font-size:34px;font-weight:700;letter-spacing:.04em;padding:10px 22px;border-radius:40px;background:#ffffff;color:#2b3a4a;margin-bottom:34px}
.title{display:block;font-size:112px;font-weight:900;line-height:1.2;letter-spacing:.01em}
.title em{font-style:normal;color:#ffd36b}
.sub{font-size:38px;font-weight:500;line-height:1.5;margin-top:30px;opacity:.95}
.badges{display:flex;flex-wrap:wrap;gap:16px;margin-top:40px}
.badge{font-size:36px;font-weight:800;padding:12px 26px;border-radius:14px;background:#ffd36b;color:#2b2416}
.badge.alt{background:rgba(255,255,255,.92);color:#222}
.logo{position:absolute;right:40px;bottom:30px;font-size:26px;font-weight:700;letter-spacing:.12em;color:#fff;background:rgba(0,0,0,.45);padding:8px 18px;border-radius:8px}</style>
<div class="stage">
<div class="panel"></div>
<img class="side" src="giaretti-sheet.jpg" alt="Giaretti 珈樂堤奶瓶清洗機、營養調理機與原汁機">
<div class="text">
<h1 style="margin:0;font:inherit"><span class="brand">Giaretti 珈樂堤</span><span class="title">洗奶瓶、<br>打豆漿<br><em>交給機器</em></span></h1>
<p class="sub">奶瓶清洗機、調理機、原汁機怎麼挑</p>
<div class="badges"><span class="badge">12/31 開團</span><span class="badge alt">義大利品牌</span></div>
</div>
<p class="logo">鷹家選物誌</p>
</div>
</html>
