<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<style>
*{box-sizing:border-box}html,body{margin:0;width:1600px;height:1000px;overflow:hidden;background:#f7f2e8;color:#263c38}body{font-family:"Noto Sans TC","PingFang TC",sans-serif}.cover{width:1600px;height:1000px;background:#f7f2e8;position:relative}.heading{height:350px;padding:58px 390px 42px 96px;position:relative;background:linear-gradient(110deg,#fbf8f1,#eee6d7)}.heading:before{content:"";display:block;width:86px;height:8px;border-radius:8px;background:#c3694d;margin-bottom:23px}.kicker{margin:0 0 15px;color:#a55b43;font-size:23px;font-weight:700;letter-spacing:.14em}.brand{margin:0;font-family:"Noto Serif TC","Songti TC",serif;font-size:64px;line-height:1.1;letter-spacing:.02em}.title{margin:12px 0 0;font-family:"Noto Serif TC","Songti TC",serif;font-size:41px;line-height:1.25}.product{position:absolute;right:88px;top:35px;width:280px;height:280px;border-radius:50%;overflow:hidden;border:14px solid #fffaf1;box-shadow:0 20px 48px rgba(43,57,49,.18);z-index:3;background:#eee}.product img{width:100%;height:100%;object-fit:cover;object-position:center 18%}.compare{height:650px;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 44px 42px}.panel{position:relative;overflow:hidden;background:#ddd;border-radius:22px}.panel img{width:100%;height:100%;object-fit:cover;object-position:center center}.panel:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(24,39,34,.05),transparent 45%,rgba(24,39,34,.18))}.label{position:absolute;left:34px;top:28px;z-index:2;background:rgba(255,252,245,.94);color:#2c4740;border-radius:999px;padding:14px 24px;font-size:26px;font-weight:700;box-shadow:0 10px 30px rgba(33,48,42,.13)}.arrow{position:absolute;left:50%;top:665px;transform:translate(-50%,-50%);z-index:4;width:82px;height:82px;border-radius:50%;display:grid;place-items:center;background:#c3694d;color:#fff;border:8px solid #f7f2e8;font-size:44px;font-weight:700;box-shadow:0 12px 30px rgba(42,54,48,.18)}
</style>
<style>
.heading{padding:64px 65px 36px 625px}
.brand{font-size:62px}.title{font-size:40px}
.product{left:78px;right:auto;top:32px;width:285px;height:285px;border-width:12px}
.product:after{content:none}
.product-detail{left:300px;top:105px;width:230px;height:230px;border-width:10px}
.product-detail img{width:140%;height:140%;max-width:none;object-fit:cover;transform:translate(-12%,-24%)}
</style>
</head>
<body>
<main class="cover">
  <header class="heading">
    <p class="kicker">親子旅行收納指南</p>
    <h1 class="brand">收麻吉手捲壓縮袋</h1>
    <p class="title">旅行怎麼挑尺寸與袋數？</p>
  </header>
  <div class="product"><img src="cover-product-source.webp" alt=""></div>
  <div class="product product-detail"><img src="roll-step.webp" alt=""></div>
  <section class="compare">
    <figure class="panel"><span class="label">壓縮前</span><img src="cover-before-source.webp" alt=""></figure>
    <figure class="panel"><span class="label">手捲後</span><img src="cover-after-source.webp" alt=""></figure>
  </section>
  <div class="arrow" aria-hidden="true">→</div>
</main>
</body>
</html>
