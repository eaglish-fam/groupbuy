<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow">
  <title>墾丁凱撒大飯店｜選物誌首圖原稿</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1600px; height: 1000px; overflow: hidden; }
    .cover { position: relative; width: 1600px; height: 1000px; background: #f3f0e5; color: #294e43; overflow: hidden; }
    .photo { position: absolute; inset: 0 0 0 auto; width: 940px; height: 1000px; object-fit: cover; object-position: 52% center; }
    .veil { position: absolute; inset: 0; background: linear-gradient(90deg, #f3f0e5 0%, #f3f0e5 43%, rgba(243,240,229,.97) 45%, rgba(243,240,229,.72) 48%, rgba(243,240,229,0) 56%); }
    .copy { position: relative; z-index: 1; width: 790px; height: 100%; padding: 110px 0 104px 100px; display: flex; flex-direction: column; justify-content: center; }
    .eyebrow { margin: 0 0 42px; font: 500 30px/1.4 'PingFang TC', sans-serif; letter-spacing: .16em; color: #9a543a; }
    .rule { width: 64px; height: 3px; background: #9a543a; margin-bottom: 38px; }
    h1 { margin: 0; font: 700 132px/1.22 'Songti TC', 'Noto Serif TC', serif; letter-spacing: .02em; }
    h1 span { display: block; white-space: nowrap; }
    .punchline { margin: 47px 0 0; font: 500 47px/1.65 'Songti TC', 'Noto Serif TC', serif; letter-spacing: .02em; color: #435d51; }
    .punchline span { display: block; white-space: nowrap; }
  </style>
</head>
<body>
  <main class="cover" aria-label="墾丁凱撒大飯店，親子選房指南">
    <img class="photo" src="cover.webp" width="1600" height="1000" alt="墾丁凱撒大飯店的真實椰林泳池照片">
    <div class="veil" aria-hidden="true"></div>
    <div class="copy">
      <p class="eyebrow">親子選房指南</p>
      <div class="rule" aria-hidden="true"></div>
      <h1><span>墾丁凱撒</span><span>大飯店</span></h1>
      <p class="punchline"><span>先選對房，</span><span>把假期留給一家人。</span></p>
    </div>
  </main>
</body>
</html>
