<svg xmlns="http://www.w3.org/2000/svg" width="720" height="650" viewBox="0 0 720 650" role="img" aria-labelledby="sas-route-title sas-route-desc">
  <title id="sas-route-title">從挪威本土飛往長年鎮｜SAS兩條路線</title>
  <desc id="sas-route-desc">SAS 兩條前往長年鎮的路線：奧斯陸 OSL 直飛長年鎮 LYR，SK4492 或 SK4496，約 3 小時；或搭 SK4414，奧斯陸 OSL 經停特羅姆瑟 TOS 再到長年鎮 LYR，含約 40 分鐘經停，共約 4 小時 10 分。箭頭只表示機場順序，不代表地理比例；班號來自目前班表示例，並非本家當年實搭證明。</desc>
  <defs>
    <marker id="route-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L7 4.5 L0 9" fill="none" stroke="#784b39" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="720" height="650" fill="#faf8f2"/>
  <g font-family="Songti TC, PMingLiU, serif" font-weight="500" fill="#443a2e">
    <text x="36" y="58" font-size="40">從挪威本土飛往長年鎮</text>
    <text x="36" y="104" font-size="36" fill="#784b39">SAS 兩條路線</text>
    <text x="36" y="163" font-size="40">直飛：約 3 小時</text>
    <g text-anchor="middle">
      <text x="150" y="220" font-size="40">奧斯陸</text><text x="150" y="261" font-size="36">OSL</text>
      <text x="570" y="220" font-size="40">長年鎮</text><text x="570" y="261" font-size="36">LYR</text>
      <text x="360" y="322" font-size="36" fill="#784b39">SK4492 / SK4496</text>
    </g>
    <path d="M166 280 H550" fill="none" stroke="#784b39" stroke-width="3" marker-end="url(#route-arrow)"/>
    <circle cx="150" cy="280" r="6" fill="#784b39"/><circle cx="570" cy="280" r="6" fill="#784b39"/>
    <path d="M36 353 H684" stroke="#d9cdbf" stroke-width="1.5"/>
    <text x="36" y="412" font-size="40">經停：約 4 小時 10 分</text>
    <g text-anchor="middle">
      <text x="120" y="470" font-size="40">奧斯陸</text><text x="120" y="511" font-size="36">OSL</text>
      <text x="360" y="470" font-size="40">特羅姆瑟</text><text x="360" y="511" font-size="36">TOS</text>
      <text x="600" y="470" font-size="40">長年鎮</text><text x="600" y="511" font-size="36">LYR</text>
      <text x="360" y="580" font-size="36">經停約 40 分鐘</text>
      <text x="360" y="627" font-size="36" fill="#784b39">SK4414</text>
    </g>
    <path d="M136 531 H340" fill="none" stroke="#784b39" stroke-width="3" marker-end="url(#route-arrow)"/>
    <path d="M376 531 H580" fill="none" stroke="#784b39" stroke-width="3" marker-end="url(#route-arrow)"/>
    <circle cx="120" cy="531" r="6" fill="#784b39"/><circle cx="360" cy="531" r="6" fill="#784b39"/><circle cx="600" cy="531" r="6" fill="#784b39"/>
  </g>
</svg>
